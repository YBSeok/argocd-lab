apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: nginx-demo
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/YBSeok/argocd-lab.git
    targetRevision: main
    path: nginx

  destination:
    server: https://kubernetes.default.svc
    namespace: demo